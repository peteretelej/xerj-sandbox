name: release watch

on:
  schedule:
    - cron: "23 6 * * 1" # weekly, Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: compare pinned version against latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          LATEST="$(curl -fsSL https://api.github.com/repos/xerj-org/xerj/releases/latest | jq -r .tag_name)"
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "could not determine latest upstream release (API error?); not opening issues" >&2
            exit 1
          fi
          PINNED="v$(sed -n 's/^ARG XERJ_VERSION=//p' Dockerfile | head -n1)"
          echo "pinned: $PINNED / latest upstream: $LATEST"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "up to date"
            exit 0
          fi
          TITLE="upstream XERJ release available: $LATEST (pinned $PINNED)"
          if [ -n "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[].number')" ]; then
            echo "an issue for this release is already open"
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$(cat <<'EOF'
A newer XERJ release exists upstream. The pin in this repo is deliberate:
bumping is a review decision, not an auto-update.

- Read the upstream release notes/changelog for this version.
- Take `XERJ_VERSION` and both `XERJ_*_SHA256` values from the release's own
  asset digests (`https://api.github.com/repos/xerj-org/xerj/releases/latest`),
  never from a mirror.
- Change all three `ARG`s in one commit.
- A checksum failure at build time is a stop sign: confirm the new value comes
  from the project's own release and the changelog explains the change (see
  SAFETY.md upgrade policy) before touching it.
- After the bump, rerun `scripts/smoke-test.sh` and `scripts/posture-drift-test.sh`.
EOF
)"
