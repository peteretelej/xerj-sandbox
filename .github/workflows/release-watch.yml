name: release watch

on:
  schedule:
    - cron: "23 6 * * 1" # weekly, Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: compare pinned version against latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          LATEST="$(curl -fsSL https://api.github.com/repos/xerj-org/xerj/releases/latest | jq -r .tag_name)"
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "could not determine latest upstream release (API error?); not opening issues" >&2
            exit 1
          fi
          PINNED="v$(sed -n 's/^ARG XERJ_VERSION=//p' Dockerfile | head -n1)"
          echo "pinned: $PINNED / latest upstream: $LATEST"
          open_bump_issues() {
            gh issue list --state open --search "upstream XERJ release available in:title" --json number --jq '.[].number'
          }
          if [ "$PINNED" = "$LATEST" ]; then
            echo "up to date"
            for n in $(open_bump_issues); do
              gh issue close "$n" --comment "the pin now matches the latest upstream release; closing."
            done
            exit 0
          fi
          TITLE="upstream XERJ release available: $LATEST (pinned $PINNED)"
          if [ -n "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[].number')" ]; then
            echo "an issue for this release is already open"
            exit 0
          fi
          for n in $(open_bump_issues); do
            gh issue close "$n" --comment "superseded - latest: $LATEST, pinned: $PINNED"
          done
          gh issue create --title "$TITLE" --body-file .github/release-bump-body.md
